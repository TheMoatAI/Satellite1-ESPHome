# Kitchen Satellite1 — PrettyFlyForAWifi network.
# Distinct node name/friendly_name so the kitchen unit shows up in Home
# Assistant as its own room-scoped device (per-satellite sessions rely on
# separate identities).
substitutions:
  friendly_name: "Kitchen Satellite1"
  node_name: satellite1-kitchen
  # Explicit for the per-unit matrix (c2f84c): ch0 is near-dead on this unit.
  mic_channels: "1"

packages:
  satellite1: !include satellite1.yaml

wifi:
  networks:
    - ssid: !secret prettyfly_ssid
      password: !secret prettyfly_password
